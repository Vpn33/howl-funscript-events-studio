<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Funscript 事件编辑器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden;
                 font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
                 background: #f5f5f7; color: #333; }
    .app { display: flex; flex-direction: column; height: 100vh; padding: 10px; gap: 8px; }
    /* 顶部栏 */
    .topbar { display: flex; align-items: center; gap: 12px; padding: 8px 14px;
              background: #1e1e2e; color: #e0e0e0; flex-shrink: 0; border-radius: 6px; }
    .topbar h1 { font-size: 14px; font-weight: 600; flex: 1; color: #fbbf24; }
    .topbar .label-row { display: flex; align-items: center; gap: 6px; font-size: 12px; }
    .topbar .label-row input { padding: 3px 8px; border-radius: 4px; border: 1px solid #3a3a55;
                                background: #2a2a3e; color: #e0e0e0; font-size: 12px; min-width: 140px; }
    .topbar .btn { padding: 5px 12px; border-radius: 4px; border: none; cursor: pointer; font-size: 12px; }
    .btn-cancel { background: #374151; color: #d1d5db; }
    .btn-save   { background: #10b981; color: white; font-weight: 600; }
    .btn-save:hover { background: #059669; }
    .btn-push   { background: #409eff; color: white; }
    .btn-push:hover { background: #337ecc; }
    /* canvas 区 */
    .canvas-wrap { flex: 1; min-height: 180px; background: white;
                   border: 1px solid #e4e7ed; border-radius: 6px; position: relative; overflow: hidden; }
    canvas { width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
    .playhead-info { position: absolute; top: 6px; right: 10px; font-size: 11px;
                     color: #666; background: rgba(255,255,255,0.85); padding: 2px 6px; border-radius: 3px; }
    /* actions 表格 */
    .table-wrap { flex: 1 1 0; overflow-y: auto; background: white;
                  border: 1px solid #e4e7ed; border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 4px 6px; border-bottom: 1px solid #ebeef5; text-align: left; }
    th { background: #f5f7fa; color: #606266; font-weight: 600; position: sticky; top: 0; }
    td input { width: 100%; padding: 3px 6px; border: 1px solid #dcdfe6; border-radius: 3px;
               font-size: 12px; background: white; }
    td input:focus { outline: none; border-color: #409eff; }
    .sel-col { width: 30px; text-align: center; }
    .del-link { color: #f56c6c; cursor: pointer; background: none; border: none; font-size: 12px; }
    .del-link:hover { text-decoration: underline; }
    /* 按钮行 */
    .btn-row { display: flex; gap: 8px; padding: 8px 12px; background: white; flex-shrink: 0;
               border: 1px solid #e4e7ed; border-radius: 6px; align-items: center; flex-wrap: wrap; }
    .btn-row button { padding: 5px 14px; border-radius: 4px; border: 1px solid #dcdfe6;
                      background: white; cursor: pointer; font-size: 12px; color: #606266; }
    .btn-row button:hover { border-color: #409eff; color: #409eff; }
    .btn-row button.primary { background: #409eff; color: white; border-color: #409eff; }
    .btn-row button.primary:hover { background: #66b1ff; }
    .btn-row button.danger { color: #f56c6c; border-color: #f56c6c; }
    .btn-row button.danger:hover { background: #fef0f0; }
    .btn-row button.danger:disabled { color: #c0c4cc; border-color: #e4e7ed; cursor: not-allowed; background: transparent; }
    .btn-row button.plain-warn { color: #e6a23c; border-color: #e6a23c; }
    .btn-row button.plain-warn:hover { background: #fdf6ec; }
    .btn-row .divider { width: 1px; height: 18px; background: #ebeef5; margin: 0 4px; }
    .btn-row label { color: #909399; font-size: 12px; display: flex; align-items: center; gap: 4px; }
    .btn-row input[type="number"] { padding: 4px 8px; border: 1px solid #dcdfe6; border-radius: 4px;
                                    font-size: 12px; width: 90px; }
    .btn-row input[type="number"]:focus { outline: none; border-color: #409eff; }
    /* 内置波形生成器 */
    .wave-gen { display: flex; gap: 10px; padding: 8px 12px; background: white;
                border: 1px solid #e4e7ed; border-radius: 6px; align-items: center;
                flex-wrap: nowrap; white-space: nowrap; font-size: 12px; overflow-x: auto; }
    .wave-gen label { color: #606266; display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .wave-gen select, .wave-gen input[type="number"] {
      padding: 4px 8px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 12px;
      background: white; color: #333; flex-shrink: 0;
    }
    .wave-gen select:focus, .wave-gen input[type="number"]:focus { outline: none; border-color: #409eff; }
    .wave-gen input[type="number"] { width: 62px; }
    .wave-gen select { width: 130px; }
    .wave-gen input[type="checkbox"] { margin-right: 2px; }
    .wave-gen .btn-gen { padding: 5px 14px; background: #67c23a; color: white; border: none;
                         border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; flex-shrink: 0; }
    .wave-gen .btn-gen:hover { background: #529b2e; }
    .wave-gen .btn-pulse { padding: 5px 14px; background: white; color: #409eff; border: 1px solid #409eff;
                           border-radius: 4px; cursor: pointer; font-size: 12px; flex-shrink: 0; }
    .wave-gen .btn-pulse:hover { background: #ecf5ff; }
    /* loading */
    .loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
               color: #999; font-size: 14px; }
    /* 模态框 */
    .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000;
                  display: flex; align-items: center; justify-content: center; }
    .modal-box { background: white; border-radius: 8px; width: 520px; max-width: 92vw;
                 max-height: 86vh; display: flex; flex-direction: column; overflow: hidden;
                 box-shadow: 0 8px 28px rgba(0,0,0,0.2); }
    .modal-title { padding: 14px 20px; font-size: 15px; font-weight: 600; color: #303133;
                   border-bottom: 1px solid #ebeef5; background: #fafbfc; flex-shrink: 0; }
    .modal-body { padding: 16px 20px; overflow-y: auto; flex: 1; }
    .modal-toolbar { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; font-size: 12px; color: #606266; }
    .modal-toolbar button { padding: 5px 12px; border-radius: 4px; border: 1px solid #dcdfe6;
                            background: white; cursor: pointer; font-size: 12px; }
    .modal-toolbar button:hover { border-color: #409eff; color: #409eff; }
    .modal-toolbar label { display: flex; align-items: center; gap: 4px; }
    .modal-toolbar input[type="number"] { padding: 4px 8px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 12px; }
    .modal-body textarea { width: 100%; height: 200px; padding: 8px 10px; border: 1px solid #dcdfe6;
                           border-radius: 4px; font-family: monospace; font-size: 12px; color: #333;
                           resize: vertical; }
    .modal-body textarea:focus { outline: none; border-color: #409eff; }
    .modal-hint { margin-top: 10px; font-size: 11px; color: #909399; line-height: 1.6; }
    .modal-footer { padding: 12px 20px; border-top: 1px solid #ebeef5; display: flex;
                    justify-content: flex-end; gap: 10px; flex-shrink: 0; background: #fafbfc; }
    .modal-footer button { padding: 7px 18px; border-radius: 4px; cursor: pointer; font-size: 13px; border: none; }
    .btn-cancel-md { background: white; border: 1px solid #dcdfe6 !important; color: #606266; }
    .btn-cancel-md:hover { border-color: #409eff; color: #409eff; }
    .btn-confirm-md { background: #409eff; color: white; }
    .btn-confirm-md:hover { background: #337ecc; }
  </style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <h1 id="evTitle">加载中…</h1>
    <div class="label-row">
      <span>ID：</span>
      <input type="text" id="evIdInput" readonly style="background:#1e1e2e;border-color:#3a3a55;cursor:default;">
    </div>
    <div class="label-row">
      <span>名称：</span>
      <input type="text" id="evTitleInput" placeholder="事件名称">
    </div>
    <button class="btn btn-push" id="btnPush">推送到设备</button>
    <button class="btn btn-cancel" id="btnCancel">取消</button>
    <button class="btn btn-save" id="btnSave">保存</button>
  </div>

  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="cv"></canvas>
    <div class="playhead-info" id="phInfo"></div>
    <div class="loading" id="loading">加载事件数据…</div>
  </div>

  <div class="btn-row">
    <button id="btnAdd">+ 添加动作</button>
    <button id="btnDelSel" class="danger" disabled>删除选中 (0)</button>
    <button id="btnClear" class="danger">清空全部</button>
    <div class="divider"></div>
    <label>按时间删除
      <input type="number" id="rangeStart" min="0" step="100" placeholder="起始">
      ~
      <input type="number" id="rangeEnd" min="0" step="100" placeholder="结束">
    </label>
    <button id="btnDelRange" class="plain-warn">删除区间</button>
    <div class="divider"></div>
    <button id="btnSort">排序去重</button>
    <button id="btnLoop">切换循环</button>
    <button id="btnPlay" class="primary">预览播放</button>
  </div>

  <div class="wave-gen">
    <label>内置波形
      <select id="wgShape"></select>
    </label>
    <label><input type="checkbox" id="wgFromEnd" checked> 从末尾开始</label>
    <label>时长ms <input type="number" id="wgDuration" value="5000" min="100" step="100"></label>
    <label>周期ms <input type="number" id="wgPeriod" value="1000" min="50" step="50"></label>
    <label>位置min <input type="number" id="wgMin" value="0" min="0" max="100"></label>
    <label>max <input type="number" id="wgMax" value="100" min="0" max="100"></label>
    <button class="btn-gen" id="btnGenWave">生成并添加</button>
    <button class="btn-pulse" id="btnPulse">导入 .pulse 文件</button>
    <input type="file" id="pulseFile" accept=".pulse,text/plain" style="display:none">
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="sel-col"><input type="checkbox" id="chkAll"></th>
          <th style="width: 40px;">#</th>
          <th>时间 at (ms)</th>
          <th>位置 pos (0-100)</th>
          <th style="width: 60px;">操作</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <!-- 导入 .pulse 模态框 -->
  <div class="modal-mask" id="pulseModal" style="display:none">
    <div class="modal-box">
      <div class="modal-title">导入 .pulse 波形文件 (Dungeonlab+pulse)</div>
      <div class="modal-body">
        <div class="modal-toolbar">
          <button id="pulsePickFile">选择文件</button>
          <input type="file" id="pulseFile2" accept=".pulse,text/plain" style="display:none">
          <label><input type="checkbox" id="pulseBreakFlat" checked> 自动打破平段</label>
          <label>扰动 ± <input type="number" id="pulseVariation" value="3" min="0" max="20" step="1" style="width:60px"></label>
        </div>
        <textarea id="pulseText" placeholder="粘贴 .pulse 文件内容，例如：
Dungeonlab+pulse:0,1=59,20.39,1,1/100.00-1,100.00-1+section+..."></textarea>
        <div class="modal-hint">强度(0-100)→位置pos；每个元 = 100/rate ms；频率信息无法映射到 funscript，将被忽略。开启「打破平段」后，连续 ≥3 个 pos 相同的区域会注入 ±扰动。</div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel-md" id="pulseCancel">取消</button>
        <button class="btn-confirm-md" id="pulseImport">转换并追加到当前事件</button>
      </div>
    </div>
  </div>
</div>
<script src="wave-editor-core.js"></script>
<script src="inline-editor.js"></script>
</body>
</html>
