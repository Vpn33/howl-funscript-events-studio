<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Funscript 事件编辑器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden;
                 font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
                 background: #f5f5f7; color: #333; }
    .app { display: flex; flex-direction: column; height: 100vh; padding: 10px; gap: 8px; }
    /* 顶部栏 */
    .topbar { display: flex; align-items: center; gap: 12px; padding: 8px 14px;
              background: #1e1e2e; color: #e0e0e0; flex-shrink: 0; border-radius: 6px; }
    .topbar h1 { font-size: 14px; font-weight: 600; flex: 1; color: #fbbf24; }
    .topbar .label-row { display: flex; align-items: center; gap: 6px; font-size: 12px; }
    .topbar .label-row input { padding: 3px 8px; border-radius: 4px; border: 1px solid #3a3a55;
                                background: #2a2a3e; color: #e0e0e0; font-size: 12px; min-width: 140px; }
    .topbar .btn { padding: 5px 12px; border-radius: 4px; border: none; cursor: pointer; font-size: 12px; }
    .btn-cancel { background: #374151; color: #d1d5db; }
    .btn-save   { background: #10b981; color: white; font-weight: 600; }
    .btn-save:hover { background: #059669; }
    .btn-push   { background: #409eff; color: white; }
    .btn-push:hover { background: #337ecc; }
    /* canvas 区 */
    .canvas-wrap { flex: 1; min-height: 180px; background: white;
                   border: 1px solid #e4e7ed; border-radius: 6px; position: relative; overflow: hidden; }
    canvas { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
    canvas:active { cursor: grabbing; }
    .playhead-info { position: absolute; top: 6px; right: 10px; font-size: 11px;
                     color: #666; background: rgba(255,255,255,0.85); padding: 2px 6px; border-radius: 3px; }
    /* actions 表格 */
    .table-wrap { flex: 1 1 0; overflow-y: auto; overflow-x: auto; background: white;
                  border: 1px solid #e4e7ed; border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 500px; }
    th, td { padding: 4px 6px; border-bottom: 1px solid #ebeef5; text-align: left; }
    th { background: #f5f7fa; color: #606266; font-weight: 600; position: sticky; top: 0; }
    td input { width: 100%; padding: 3px 6px; border: 1px solid #dcdfe6; border-radius: 3px;
               font-size: 12px; background: white; }
    td input:focus { outline: none; border-color: #409eff; }
    .sel-col { width: 30px; text-align: center; }
    .del-link { color: #f56c6c; cursor: pointer; background: none; border: none; font-size: 12px; }
    .del-link:hover { text-decoration: underline; }
    /* 按钮行 */
    .btn-row { display: flex; gap: 8px; padding: 8px 12px; background: white; flex-shrink: 0;
               border: 1px solid #e4e7ed; border-radius: 6px; align-items: center; flex-wrap: wrap; }
    .btn-row button { padding: 5px 14px; border-radius: 4px; border: 1px solid #dcdfe6;
                      background: white; cursor: pointer; font-size: 12px; color: #606266; }
    .btn-row button:hover { border-color: #409eff; color: #409eff; }
    .btn-row button.primary { background: #409eff; color: white; border-color: #409eff; }
    /* 波形生成器 */
    .wavegen { display: flex; gap: 8px; padding: 8px 12px; background: white;
               border: 1px solid #e4e7ed; border-radius: 6px; align-items: center; flex-wrap: wrap; }
    .wavegen button { padding: 5px 12px; border-radius: 4px; border: 1px solid #dcdfe6;
                      background: white; cursor: pointer; font-size: 12px; }
    .wavegen select, .wavegen input { padding: 4px 8px; border: 1px solid #dcdfe6; border-radius: 3px; }
    /* 脉冲导入模态框 */
    #pulseModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                  background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
    #pulseModal .modal { background: white; border-radius: 8px; padding: 20px; width: 70%; max-width: 640px; }
    #pulseModal textarea { width: 100%; height: 200px; margin: 10px 0; font-family: monospace; font-size: 11px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
    /* loading */
    #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%;
               background: rgba(255,255,255,0.9); display: flex; justify-content: center; align-items: center;
               z-index: 9999; font-size: 14px; color: #606266; }
    /* 时间范围控件 */
    .range-control { display: flex; align-items: center; gap: 6px; }
    .range-control input[type="number"] { width: 80px; padding: 4px 8px; border: 1px solid #dcdfe6; border-radius: 3px; }
    /* 提示 */
    .hint { font-size: 11px; color: #909399; margin-left: auto; }
  </style>
</head>
<body>
<div id="loading">加载中...</div>

<div class="app">
  <div class="topbar">
    <h1>Funscript 事件编辑器</h1>
    <div class="label-row">
      <span>ID:</span>
      <input type="text" id="evIdInput" placeholder="event_id">
    </div>
    <div class="label-row">
      <span>名称:</span>
      <input type="text" id="evTitleInput" placeholder="事件名称">
    </div>
    <button class="btn btn-push" id="btnPush">推送到设备</button>
    <button class="btn btn-cancel" id="btnCancel">取消</button>
    <button class="btn btn-save primary" id="btnSave">保存</button>
  </div>

  <!-- canvas -->
  <div class="canvas-wrap">
    <canvas id="cv"></canvas>
    <div class="playhead-info" id="phInfo"></div>
  </div>

  <!-- 波形生成器 -->
  <div class="wavegen">
    <span>内置波形</span>
    <select id="wgShape"><option value="sine">正弦波 (Sine)</option></select>
    <label><input type="checkbox" id="wgFromEnd" checked>从末尾开始</label>
    <span>时长 ms</span>
    <input type="number" id="wgDuration" value="5000" min="100" step="500">
    <span>周期 ms</span>
    <input type="number" id="wgPeriod" value="1000" min="50" step="100">
    <span>位置 min</span>
    <input type="number" id="wgMin" value="0" min="0" max="100">
    <span>max</span>
    <input type="number" id="wgMax" value="100" min="0" max="100">
    <button id="btnGenWave">生成并添加</button>
    <el-divider direction="vertical"></el-divider>
    <button id="btnPulse">导入 .pulse 文件</button>
  </div>

  <!-- 脉冲导入模态框 -->
  <div id="pulseModal" class="modal">
    <h3>导入 .pulse 波形文件 (Dungeonlab+pulse)</h3>
    <p style="font-size:12px;color:#666;margin:8px 0 12px;">强度 (0-100)→位置 pos；每个元=100/rate ms；频率信息无法映射到 funscript，将被忽略。</p>
    <textarea id="pulseText" placeholder="粘贴 .pulse 文件内容"></textarea>
    <label style="font-size:12px;"><input type="checkbox" id="pulseBreakFlat" checked>自动打破平段</label>
    <span style="font-size:11px;color:#666;margin-left:8px;">扰动 ±</span>
    <input type="number" id="pulseVariation" value="3" min="1" max="100" style="width:50px;padding:4px;">
    <div class="modal-actions">
      <button id="pulseCancel">取消</button>
      <button id="pulseImport">导入并添加</button>
    </div>
  </div>

  <!-- actions 表格 -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th style="width:30px;"><input type="checkbox" id="chkAll"></th>
          <th style="width:40px;">#</th>
          <th>时间 at (ms)</th>
          <th>位置 pos (0-100)</th>
          <th>时间</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <!-- 按钮行 -->
  <div class="btn-row">
    <button id="btnAdd">+ 添加动作</button>
    <button id="btnDelSel">删除选中 (0)</button>
    <button class="btn-row" style="background:#fef0f0;border-color:#fd8989;" id="btnClear">清空全部</button>
    <div class="range-control">
      <span>时间范围显示 (秒)</span>
      <input type="number" id="viewRangeMs" value="10000" min="100" step="100">
      <button id="btnApplyRange">应用</button>
    </div>
    <span class="hint">表格只显示最近 10 秒的动作，提升性能 (Canvas 始终显示完整波形)</span>
    <button id="btnSort">排序去重</button>
    <button id="btnLoop">切换循环</button>
    <button id="btnDelRange" style="background:#fef0f0;border-color:#fd8989;">删除区间</button>
    <button id="btnPlay" class="primary">预览播放</button>
  </div>
</div>

<!-- wave-editor-core.js -->
<script src="wave-editor-core.js"></script>
<!-- inline-editor.js -->
<script src="inline-editor.js"></script>
</body>
</html>
